# 按变更路径智能分流：桌面端快速反馈（typecheck / lint / test / build）、跨平台后端测试、TLA+ 形式化校验、Docker CPU 镜像验证，最终由 ci-summary 汇总门禁。
name: CI
on:
  push:
    branches: [main, platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"  # Windows 上中文输出不按 GBK / cp1252

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      formal: ${{ steps.filter.outputs.formal }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          run_all=false
          base_sha=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            run_all=true
          else
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${PR_BASE_SHA:-}"
            else
              base_sha="${PUSH_BEFORE_SHA:-}"
            fi

            if [[ -z "${base_sha}" ]] || [[ "${base_sha}" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              run_all=true
            fi
          fi

          backend=false
          desktop=false
          formal=false
          docker=false

          if [[ "${run_all}" == "true" ]]; then
            backend=true
            desktop=true
            formal=true
            docker=true
            echo "Running all jobs (event=${GITHUB_EVENT_NAME}, ref_type=${GITHUB_REF_TYPE}, base=${base_sha:-none})"
          else
            mapfile -t changed_files < <(git -c core.quotepath=false diff --name-only "${base_sha}" HEAD)
            echo "Changed files (${#changed_files[@]}):"
            if (( ${#changed_files[@]} > 0 )); then
              for f in "${changed_files[@]}"; do
                [[ -z "$f" ]] && continue
                echo "  - $f"

                if [[ "$f" == ".github/workflows/ci.yml" ]]; then
                  backend=true
                  desktop=true
                  formal=true
                  docker=true
                  continue
                fi

                if [[ "$f" == desktop/* || "$f" == "scripts/check_invariants.py" ]]; then
                  desktop=true
                fi

                if [[ "$f" =~ ^[^/]+\.py$ || "$f" == "pyproject.toml" || "$f" == "uv.lock" || "$f" == static/* || "$f" == tests/* || "$f" == scripts/* ]]; then
                  backend=true
                fi

                if [[ "$f" == formal/* || "$f" == "scripts/check_formal.sh" || "$f" =~ ^[^/]+\.py$ ]]; then
                  formal=true
                fi

                if [[ "$f" == "Dockerfile" || "$f" =~ ^[^/]+\.py$ || "$f" == "pyproject.toml" || "$f" == "uv.lock" || "$f" == static/* || "$f" == "scripts/install-linux-cpu.sh" ]]; then
                  docker=true
                fi
              done
            fi
          fi

          echo "Selected targets: backend=${backend}, desktop=${desktop}, formal=${formal}, docker=${docker}"
          {
            echo "backend=${backend}"
            echo "desktop=${desktop}"
            echo "formal=${formal}"
            echo "docker=${docker}"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: 结构不变量检查（INV001-INV010）
        run: python3 scripts/check_invariants.py
      - name: 安装桌面端依赖
        run: pnpm --dir desktop install --frozen-lockfile
      - name: TypeScript 类型检查
        run: pnpm --dir desktop typecheck
      - name: Biome 代码规范检查
        run: pnpm --dir desktop lint
      - name: 桌面端单元测试（Vitest）
        run: pnpm --dir desktop test
      - name: 桌面端构建（electron-vite build）
        run: pnpm --dir desktop build

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      MODELSCOPE_CACHE: ${{ github.workspace }}/.ms-cache
      MN_TEST_LOAD_S: "900"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: ffmpeg、PulseAudio（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg pulseaudio pulseaudio-utils
      - name: ffmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg（macOS）
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: 依赖（Linux 用 CPU 版 torch）
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-cpu.sh
      - name: 依赖
        if: runner.os != 'Linux'
        run: uv sync --frozen
      - name: 校验锁文件一致（uv.lock）
        run: uv lock --check && uv export --frozen --no-hashes >/dev/null
      - name: 结构不变量检查（INV001-INV010）
        run: uv run --no-sync python scripts/check_invariants.py
      - name: 单元测试（不加载语音模型）
        run: uv run --no-sync --with pytest pytest -v
      - name: 前端脚本语法检查与浏览器端降采样测试（AudioWorklet）
        run: |
          set -e
          for f in static/app.js static/js/*.js static/pcm-worklet.js; do
            node --check "$f"
          done
          node tests/audio/resampler.mjs
      - name: 浏览器端到端与深浅色 WCAG 2.2 AA 校验（Playwright Chromium）
        if: runner.os == 'Linux'
        run: |
          set -e
          npm --prefix tests/mobile ci
          npx --prefix tests/mobile playwright install --with-deps chromium
          node tests/e2e_browser.mjs

      - name: 取缓存的语音模型
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .ms-cache
          key: modelscope-v1
          enableCrossOsArchive: true
      - name: 下载 / 加载语音模型（Paraformer、VAD、标点、说话人、Fun-ASR-Nano）
        run: |
          MEETING_DATA="$RUNNER_TEMP/mn-load" uv run --no-sync python -c "
          import time, asr_engine
          t = time.time(); e = asr_engine.Engine(); e.load()
          assert e.ready and e.nano is not None, (e.error, e.nano_error)
          print('models ready on', asr_engine.DEVICE, round(time.time() - t), 's')"
      - name: 存语音模型缓存
        if: steps.models.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: .ms-cache
          key: modelscope-v1
          enableCrossOsArchive: true

      - name: 集成测试（录音续接、局域网访问）
        run: |
          set -e
          uv run --no-sync python tests/test_live_resume.py
          uv run --no-sync python tests/test_lan_security.py
      # macOS 只跑到这里：GitHub 的 macOS 虚拟机上 MPS 算出来的结果不对（实测 Nano 把示例录音认成“我爱你们”），真机上没问题
      - name: 端到端：上传录音转写（paraformer、nano）
        if: runner.os == 'Windows'
        run: uv run --no-sync python tests/smoke_e2e.py
      - name: 端到端：上传录音转写 + 全天模式从 PulseAudio 采音
        if: runner.os == 'Linux'
        run: |
          set -e
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mn
          pactl set-default-source mn.monitor
          uv run --no-sync python tests/smoke_e2e.py --ambient-play "paplay -d mn {wav}"
      - name: 说话人分离子进程（pyannote）能导入、能跑
        run: |
          set -e
          WAV=$(uv run --no-sync python -c "import sys; sys.path.insert(0, 'tests'); import smoke_e2e; print(smoke_e2e.find_sample())")
          uv run --no-sync python diarize_worker.py "$WAV" "$RUNNER_TEMP/diar.json"
          cat "$RUNNER_TEMP/diar.json"
      - name: 说话人分离子进程断网也能跑、不发起任何网络连接
        if: runner.os != 'macOS'
        run: uv run --no-sync python tests/test_diarize_offline.py

  formal:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 缓存 tla2tools.jar
        uses: actions/cache@v4
        with:
          path: .cache/tla2tools-1.7.4
          key: tla2tools-1.7.4
      - name: TLA+ 形式化模型校验（状态机与并发不变量）
        run: bash scripts/check_formal.sh

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker 镜像（CPU）
        run: docker build -t meeting-notes:ci .
      - name: 校验容器运行环境（非 root、tini、iproute2、无 uv、模块可导入）
        run: |
          set -e
          test "$(docker run --rm --entrypoint id meeting-notes:ci -u)" != "0"
          docker run --rm --entrypoint sh meeting-notes:ci -c "
            test -x /usr/bin/tini
            command -v ip >/dev/null
            ! command -v uv >/dev/null
            python -c 'import lan, app; print(\"docker ok\")'
          "

  ci-summary:
    needs: [changes, desktop, test, formal, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize CI results and enforce gate
        env:
          RES_CHANGES: ${{ needs.changes.result }}
          RES_DESKTOP: ${{ needs.desktop.result }}
          RES_TEST: ${{ needs.test.result }}
          RES_FORMAL: ${{ needs.formal.result }}
          RES_DOCKER: ${{ needs.docker.result }}
          OUT_DESKTOP: ${{ needs.changes.outputs.desktop }}
          OUT_BACKEND: ${{ needs.changes.outputs.backend }}
          OUT_FORMAL: ${{ needs.changes.outputs.formal }}
          OUT_DOCKER: ${{ needs.changes.outputs.docker }}
        run: |
          set -euo pipefail

          badge() {
            case "$1" in
              success) echo "✅ success" ;;
              skipped) echo "⏭️ skipped" ;;
              failure) echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "⚠️ ${1:-unknown}" ;;
            esac
          }

          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Triggered | Result |"
            echo "|---|---|---|"
            echo "| \`changes\` | always | $(badge "$RES_CHANGES") |"
            echo "| \`desktop\` | \`${OUT_DESKTOP:-n/a}\` | $(badge "$RES_DESKTOP") |"
            echo "| \`test\` | \`${OUT_BACKEND:-n/a}\` | $(badge "$RES_TEST") |"
            echo "| \`formal\` | \`${OUT_FORMAL:-n/a}\` | $(badge "$RES_FORMAL") |"
            echo "| \`docker\` | \`${OUT_DOCKER:-n/a}\` | $(badge "$RES_DOCKER") |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for pair in \
            "changes:${RES_CHANGES}" \
            "desktop:${RES_DESKTOP}" \
            "test:${RES_TEST}" \
            "formal:${RES_FORMAL}" \
            "docker:${RES_DOCKER}"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [[ "$res" != "success" && "$res" != "skipped" ]]; then
              echo "::error::CI gate failed: job '${job}' ended with result '${res}'."
              failed=1
            fi
          done

          exit "$failed"
