# 在 Linux / Windows / macOS 上各跑一遍：单元测试 → 下载（或从缓存取）语音模型 → 集成测试 → 端到端转写一段普通话录音（macOS 除外）。
# Linux 上另外用 PulseAudio 虚拟声卡测全天模式的采音（放录音进去，核对自动记录出来的文字），并校验 Docker 镜像构建。
name: CI
on:
  push:
    branches: [main, platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"  # Windows 上中文输出不按 GBK / cp1252
  MODELSCOPE_CACHE: ${{ github.workspace }}/.ms-cache
  MN_TEST_LOAD_S: "900"

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: ffmpeg、PulseAudio（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg pulseaudio pulseaudio-utils
      - name: ffmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: ffmpeg（macOS）
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: 依赖（Linux 用 CPU 版 torch）
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-cpu.sh
      - name: 依赖
        if: runner.os != 'Linux'
        run: uv sync --frozen
      - name: 校验锁文件一致（uv.lock）
        run: uv lock --check && uv export --frozen --no-hashes >/dev/null
      - name: 结构不变量检查（INV001-INV010）
        run: uv run --no-sync python scripts/check_invariants.py
      - name: 单元测试（不加载语音模型）
        run: uv run --no-sync --with pytest pytest -v
      - name: 前端脚本语法检查与浏览器端降采样测试（AudioWorklet）
        run: |
          set -e
          for f in static/app.js static/js/*.js static/pcm-worklet.js; do
            node --check "$f"
          done
          node tests/audio/resampler.mjs
      - name: 浏览器端到端与深浅色 WCAG 2.2 AA 校验（Playwright Chromium）
        if: runner.os == 'Linux'
        run: |
          set -e
          npm --prefix tests/mobile ci
          npx --prefix tests/mobile playwright install --with-deps chromium
          node tests/e2e_browser.mjs

      - name: 取缓存的语音模型
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .ms-cache
          key: modelscope-v1
          enableCrossOsArchive: true
      - name: 下载 / 加载语音模型（Paraformer、VAD、标点、说话人、Fun-ASR-Nano）
        run: |
          MEETING_DATA="$RUNNER_TEMP/mn-load" uv run --no-sync python -c "
          import time, asr_engine
          t = time.time(); e = asr_engine.Engine(); e.load()
          assert e.ready and e.nano is not None, (e.error, e.nano_error)
          print('models ready on', asr_engine.DEVICE, round(time.time() - t), 's')"
      - name: 存语音模型缓存
        if: steps.models.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: .ms-cache
          key: modelscope-v1
          enableCrossOsArchive: true

      - name: 集成测试（录音续接、局域网访问）
        run: |
          set -e
          uv run --no-sync python tests/test_live_resume.py
          uv run --no-sync python tests/test_lan_security.py
      # macOS 只跑到这里：GitHub 的 macOS 虚拟机上 MPS 算出来的结果不对（实测 Nano 把示例录音认成“我爱你们”），真机上没问题
      - name: 端到端：上传录音转写（paraformer、nano）
        if: runner.os == 'Windows'
        run: uv run --no-sync python tests/smoke_e2e.py
      - name: 端到端：上传录音转写 + 全天模式从 PulseAudio 采音
        if: runner.os == 'Linux'
        run: |
          set -e
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mn
          pactl set-default-source mn.monitor
          uv run --no-sync python tests/smoke_e2e.py --ambient-play "paplay -d mn {wav}"
      - name: 说话人分离子进程（pyannote）能导入、能跑
        run: |
          set -e
          WAV=$(uv run --no-sync python -c "import sys; sys.path.insert(0, 'tests'); import smoke_e2e; print(smoke_e2e.find_sample())")
          uv run --no-sync python diarize_worker.py "$WAV" "$RUNNER_TEMP/diar.json"
          cat "$RUNNER_TEMP/diar.json"
      - name: 说话人分离子进程断网也能跑、不发起任何网络连接
        if: runner.os != 'macOS'
        run: uv run --no-sync python tests/test_diarize_offline.py

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 缓存 tla2tools.jar
        uses: actions/cache@v4
        with:
          path: .cache/tla2tools-1.7.4
          key: tla2tools-1.7.4
      - name: TLA+ 形式化模型校验（状态机与并发不变量）
        run: bash scripts/check_formal.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker 镜像（CPU）
        run: docker build -t meeting-notes:ci .
      - name: 校验容器运行环境（非 root、tini、iproute2、无 uv、模块可导入）
        run: |
          set -e
          test "$(docker run --rm --entrypoint id meeting-notes:ci -u)" != "0"
          docker run --rm --entrypoint sh meeting-notes:ci -c "
            test -x /usr/bin/tini
            command -v ip >/dev/null
            ! command -v uv >/dev/null
            python -c 'import lan, app; print(\"docker ok\")'
          "
