appId: com.meetingnotes.desktop
productName: Meeting Notes
artifactName: "Meeting-Notes-${version}-${os}-${arch}.${ext}"
protocols:
  - name: Meeting Notes
    schemes:
      - meetingnotes
directories:
  buildResources: build
extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/icon.icns
    to: icon.icns
  - from: build/icon.png
    to: icon.png
  - from: vendor/backend
    to: backend
  - from: vendor/bin
    to: bin
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!biome.json"
  - "!vitest.config.ts"
  - "!tsconfig*.json"
  - "!scripts/*"
  - "!vendor/*"
  - "!.cache/*"
mac:
  icon: build/icon.icns
  artifactName: "Meeting-Notes-${version}-${arch}-mac.${ext}"
  category: public.app-category.productivity
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    NSMicrophoneUsageDescription: 会议记录需要访问麦克风，用于实时会议录音、全天对话记录和语音转写。
    NSScreenCaptureUsageDescription: 会议记录需要捕获电脑系统音频，用于双声道录制线上会议中对方的声音。
dmg:
  title: "Meeting Notes ${version}"
  artifactName: "Meeting-Notes-${version}-${arch}.${ext}"
win:
  icon: build/icon.ico
  artifactName: "Meeting-Notes-${version}-win-${arch}-portable.${ext}"
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: "Meeting-Notes-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meeting Notes
  installerLanguages:
    - zh_CN
    - en_US
linux:
  icon: build/icon.png
  executableName: meeting-notes
  maintainer: MrDgbot <60038945+MrDgbot@users.noreply.github.com>
  category: AudioVideo;Office
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: "Meeting-Notes-${version}-${arch}.${ext}"
deb:
  artifactName: "meeting-notes_${version}_${arch}.${ext}"
  maintainer: MrDgbot <60038945+MrDgbot@users.noreply.github.com>
  depends: []
  recommends:
    - ffmpeg
npmRebuild: false
buildDependenciesFromSource: false
publish:
  provider: github
  owner: MrDgbot
  repo: meeting-notes
  releaseType: draft
