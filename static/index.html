<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="会议记录">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/lan/icon.png">
<link rel="icon" type="image/png" href="/lan/icon.png">
<title>会议记录</title>
<script>
(function () {
  try {
    var mode = localStorage.getItem("theme");
    if (mode !== "auto" && mode !== "light" && mode !== "dark") mode = "auto";
    var resolved = mode === "auto"
      ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : mode;
    var root = document.documentElement;
    root.dataset.theme = resolved;
    root.dataset.themeMode = mode;
    root.style.colorScheme = resolved;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", resolved === "dark" ? "#141414" : "#f5f5f5");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/ux-meeting.css">
</head>
<body>
<!-- 窄屏（平板竖屏、手机）：侧栏收成抽屉，顶上一条放菜单、名称、录音状态和新建 -->
<header id="topbar">
  <button class="ghost tb-btn" id="navBtn" aria-label="打开菜单" aria-controls="side" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><i class="tb-dot"></i></button>
  <a class="tb-brand" href="#/" id="tbHome"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10.5v3"/></svg></span><b>会议记录</b></a>
  <span class="grow"></span>
  <a class="tb-rec" id="tbRec" hidden></a>
  <button class="ghost tb-btn" id="tbNew" aria-label="新建会议"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</header>
<div id="scrim"></div>
<aside id="side">
  <div class="side-head">
    <a class="brand" id="homeLink" href="#/" title="回到首页"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10.5v3"/></svg></span>
      <span><b>会议记录</b><small>本机转写 · AI 纪要</small></span></a>
    <button type="button" class="ghost sm ic-btn side-toggle" id="sideToggle" aria-label="收起侧栏" title="收起侧栏 (⌘\)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 9l-3 3 3 3"/></svg></button>
  </div>
  <button class="pri block" id="newBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建会议</button>
  <div class="side-nav" aria-label="快捷视图">
    <a class="side-nav-link" href="#/todos" data-nav="todos"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>待办中心</span></a>
    <a class="side-nav-link" href="#/people" data-nav="people"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>人物</span></a>
  </div>
  <div id="ambCard"></div>
  <a id="recPill" hidden></a>
  <div class="side-search-wrap">
    <input id="searchMeetings" class="search" placeholder="搜索标题和内容" aria-label="搜索会议标题和内容">
    <button type="button" class="side-cmdk" id="cmdkBtn" aria-label="打开快速命令面板 ⌘K" title="快速命令与搜索 (⌘K)"><kbd>⌘K</kbd></button>
    <button type="button" class="side-clr" id="searchClr" aria-label="清除搜索" title="清除搜索" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="side-filters" id="sideFilters" role="group" aria-label="按分类筛选会议">
    <button type="button" class="sf-pill on" data-kind="all" aria-pressed="true">全部</button>
    <button type="button" class="sf-pill" data-kind="meeting" aria-pressed="false">会议</button>
    <button type="button" class="sf-pill" data-kind="ambient" aria-pressed="false">全天</button>
    <button type="button" class="sf-pill" data-kind="upload" aria-pressed="false">上传</button>
    <button type="button" class="sf-pill sf-short" id="hideShortBtn" aria-pressed="false" title="隐藏少于 1 分钟的自动记录">隐藏短片段</button>
  </div>
  <nav id="mlist"></nav>
  <button type="button" class="side-trash" id="trashBtn" hidden>
    <span class="side-trash-l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>废纸篓</span>
    <span class="side-trash-cnt" id="trashCnt"></span>
  </button>
  <div class="side-foot">
    <span id="asrBadge" class="badge">模型加载中…</span>
    <div class="side-acts">
      <button type="button" class="ghost sm ic-btn" id="themeBtn" aria-label="切换外观主题（当前：跟随系统）" title="外观主题：跟随系统（点击切换）"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="ghost sm ic-btn" id="kbdBtn" aria-label="快捷键速查" title="快捷键速查 (?)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.1 1.1c0 1.8-2.5 2.1-2.5 3.6"/><circle cx="12" cy="17.2" r=".7" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="ghost sm" id="settingsBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>设置</button>
    </div>
  </div>
</aside>
<button type="button" class="side-expand" id="sideExpand" aria-label="展开侧栏" title="展开侧栏 (⌘\)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M13 9l3 3-3 3"/></svg></button>
<main id="main"></main>
<div id="modal" role="dialog" aria-modal="true" hidden></div>
<div id="cmdk" role="dialog" aria-modal="true" aria-label="快速命令与搜索" hidden></div>
<div id="dropOverlay" class="drop-overlay" aria-hidden="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
